  </defs>
  <g stroke="#6e6e73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M380 62v24"/>
    <path d="M380 128v24"/>
    <path d="M380 196v24"/>
    <path d="M330 262 L190 300"/>
    <path d="M430 262 L590 300"/>
